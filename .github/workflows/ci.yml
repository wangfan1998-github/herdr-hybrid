name: ci
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: node --check
        run: npm run check
      - name: bash -n
        run: for f in install.sh tests/smoke.sh examples/parallel-review.sh; do bash -n "$f"; done
      - name: shellcheck
        run: sudo apt-get install -y shellcheck >/dev/null && shellcheck -S warning install.sh tests/smoke.sh examples/parallel-review.sh
      - name: smoke
        run: bash tests/smoke.sh
