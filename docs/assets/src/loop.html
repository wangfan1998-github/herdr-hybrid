<!doctype html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'light';</script>
<link rel="stylesheet" href="theme.css">
<style>
  body{width:1500px;height:360px}
  .wrap{padding:46px 64px 0}
  h1{font-size:28px}
  .tl{position:relative;margin-top:64px}
  .line{position:absolute;left:98px;right:98px;top:20px;height:2px;background:var(--line-strong)}
  .steps{position:relative;display:grid;grid-template-columns:repeat(7,1fr)}
  .step{text-align:center}
  .n{width:42px;height:42px;border-radius:50%;margin:0 auto;box-sizing:border-box;border:2px solid var(--accent);color:var(--accent);background:var(--bg);font-family:var(--serif);font-size:19px;line-height:38px}
  .lead .n{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .name{margin-top:14px;font-size:15.5px;font-weight:700}
  .cmd{margin-top:4px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
  .lead .cmd{font-family:var(--sans)}
  svg.back{position:absolute;left:0;top:-46px;width:1372px;height:70px;overflow:visible}
  .back path{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 5}
  .back text{font-family:var(--sans);font-size:12.5px;fill:var(--accent)}
  .legend{margin-top:34px;display:flex;gap:28px;font-size:12.5px;color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:6px}
  .legend .a{background:var(--ink)}.legend .b{border:2px solid var(--accent);box-sizing:border-box}
</style>
</head>
<body>
<div class="wrap">
  <h1>工作流零：Leader 自主闭环</h1>
  <div class="sub">用户只说一句话；Leader 从拆解到汇报全程自己跑，中途不提问。每一步是一条 hh 命令或一个 MCP 工具调用。</div>

  <div class="tl">
    <svg class="back" viewBox="0 0 1372 70">
      <defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker></defs>
      <path d="M1078 46 C1078 24, 490 24, 490 44" marker-end="url(#m)"/>
      <text x="784" y="10" text-anchor="middle">高 / 中问题 → hh send 回给原 coder（同一会话），回到 ③；worker 两轮失败 → 换 profile 重派或接管</text>
    </svg>
    <div class="line"></div>
    <div class="steps">
      <div class="step lead"><div class="n">1</div><div class="name">拆解</div><div class="cmd">子任务 + 验收命令</div></div>
      <div class="step"><div class="n">2</div><div class="name">派发</div><div class="cmd">hh dispatch -r coder</div></div>
      <div class="step"><div class="n">3</div><div class="name">等待</div><div class="cmd">hh wait --timeout 540</div></div>
      <div class="step lead"><div class="n">4</div><div class="name">验收</div><div class="cmd">hh result + 自己跑命令</div></div>
      <div class="step"><div class="n">5</div><div class="name">review</div><div class="cmd">hh dispatch -r reviewer</div></div>
      <div class="step"><div class="n">6</div><div class="name">返修</div><div class="cmd">hh send · 同一会话</div></div>
      <div class="step lead"><div class="n">7</div><div class="name">汇报</div><div class="cmd">中文表格 + 证据</div></div>
    </div>
  </div>
  <div class="legend"><span><i class="a"></i>Leader 自己做</span><span><i class="b"></i>派给 worker</span></div>
</div>
</body>
</html>
